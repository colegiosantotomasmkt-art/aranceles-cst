<script>
/* =====================================================================
   ============  PANEL DE EDICION - TOCA SOLO ESTO CADA MES  ===========
   =====================================================================

   PASO 1 - Titulo, vigencia y fecha de actualizacion (3 lineas de texto).

   PASO 2 - Cargá SOLO el precio de &quot;1 alumno&quot; de cada nivel, en cada
            periodo (bonificado y normal). Son 6 numeros por periodo.
            El resto (2do, 3er, 4to hermano y 1/2 beca) se calcula solo.

   COMO FUNCIONA EL CALCULO (logica del colegio):
   - El descuento de hermano/beca se aplica SIEMPRE sobre el precio
     BONIFICADO de &quot;1 alumno&quot;.
   - En el periodo NORMAL, ademas, se suma el recargo del periodo
     (diferencia entre el normal y el bonificado de &quot;1 alumno&quot;).
   Asi coincide exacto con la planilla de Tesoreria.

   ===================================================================== */

var ULTIMA_ACTUALIZACION = &quot;29/05/2026&quot;;

var ARANCELES = {
  tituloCuota: &quot;Cuota 4 - Junio 2026&quot;,
  vigencia: &quot;Vigente del 01/06/2026 al 30/06/2026&quot;,

  // Precio de &quot;1 alumno&quot; en cada periodo. (bonif = base de los descuentos)
  preciosBonificado: {
    &quot;Sala 2-3 años&quot;:106030, &quot;Sala 4 años&quot;:120463, &quot;Sala 5 años&quot;:135596,
    &quot;Primaria 1 a 6&quot;:157528, &quot;Secundaria 1 a 3&quot;:178132, &quot;Secundaria 4 a 6&quot;:180132
  },
  preciosNormal: {
    &quot;Sala 2-3 años&quot;:119872, &quot;Sala 4 años&quot;:135168, &quot;Sala 5 años&quot;:150564,
    &quot;Primaria 1 a 6&quot;:162760, &quot;Secundaria 1 a 3&quot;:185940, &quot;Secundaria 4 a 6&quot;:185940
  },

  etiquetaBonificado: &quot;Pago bonificado: 01/06/2026 al 06/06/2026&quot;,
  etiquetaNormal:     &quot;Pago normal: 07/06/2026 al 30/06/2026&quot;,

  jornadaExtendida:{ &quot;Sala 2-3 años&quot;:59936, &quot;Sala 4 años&quot;:67584, &quot;Sala 5 años&quot;:75282, &quot;Primaria&quot;:81380 },

  talleresPrimaria:{ &quot;Natacion&quot;:40000, &quot;Robotica&quot;:30000, &quot;Teatro&quot;:25000, &quot;Arte y Ceramica&quot;:25000 },
  talleresSecundaria:{ &quot;Musica / Pintura&quot;:20000 }
};

// % de descuento (rara vez cambian). Se aplican sobre el precio BONIFICADO.
// descPorPosicion[cantTotal][posicion] = % de descuento
var DESCUENTO_MEDIA_BECA = 0.46;
function descHermano(posicion, cantTotal){
  if(cantTotal===1) return 0;           // hijo unico: sin descuento
  if(posicion<=2) return 0.10;          // 1ro y 2do hermano: 10%
  if(posicion===3) return 0.15;         // 3er hermano: 15%
  return 0.46;                          // 4to hermano: 46%
}

/* ============  FIN DEL PANEL DE EDICION - no tocar lo de abajo  ============ */

// Construyo internamente la estructura de periodos a partir de los precios cargados.
var ARANCELES_PERIODOS = [
  { id:&quot;bonificado&quot;, etiqueta:ARANCELES.etiquetaBonificado, recargo:false },
  { id:&quot;normal&quot;,     etiqueta:ARANCELES.etiquetaNormal,     recargo:true  }
];

var niveles = Object.keys(ARANCELES.preciosBonificado);

function money(v){ if(v===null||v===undefined) return &quot;-&quot;; return &quot;$&quot;+v.toLocaleString(&quot;es-AR&quot;,{minimumFractionDigits:v%1===0?0:2,maximumFractionDigits:2}); }

// Precio de un hijo segun su posicion y cantidad total de hermanos en el colegio.
function precioPosicion(nivel, posicion, periodoId, cantTotal){
  var bonif = ARANCELES.preciosBonificado[nivel];
  var conDesc = bonif * (1 - descHermano(posicion, cantTotal));
  if(periodoId === &quot;normal&quot;){
    var recargo = ARANCELES.preciosNormal[nivel] - bonif;
    conDesc += recargo;
  }
  return +conDesc.toFixed(2);
}
function precioMediaBeca(nivel, periodoId){
  var bonif = ARANCELES.preciosBonificado[nivel];
  var conDesc = bonif * (1 - DESCUENTO_MEDIA_BECA);
  if(periodoId === &quot;normal&quot;){ conDesc += (ARANCELES.preciosNormal[nivel] - bonif); }
  return +conDesc.toFixed(2);
}

function $(id){ return document.getElementById(id); }
var ORD = {1:&quot;1&quot;,2:&quot;2&quot;,3:&quot;3&quot;,4:&quot;4&quot;};

$(&quot;htit&quot;).textContent = ARANCELES.tituloCuota;
$(&quot;hvig&quot;).textContent = ARANCELES.vigencia;
$(&quot;ult&quot;).textContent = &quot;Ultima actualizacion de valores: &quot;+ULTIMA_ACTUALIZACION;

// Tablas de valores por periodo
(function(){
  var h=&quot;&quot;;
  ARANCELES_PERIODOS.forEach(function(p){
    h+='<div class=&quot;scroll&quot;><span class=&quot;tag&quot;>'+p.etiqueta+'</span><table><thead><tr><th class=&quot;l&quot;>Concepto</th>';
    niveles.forEach(function(n){ h+='<th>'+n+'</th>'; });
    h+='</tr></thead><tbody>';
    var filas=[
      {l:&quot;1 alumno&quot;, f:function(n){return precioPosicion(n,1,p.id);}},
      {l:&quot;2 hermanos (c/u)&quot;, f:function(n){return precioPosicion(n,2,p.id);}},
      {l:&quot;3 hermano&quot;, f:function(n){return precioPosicion(n,3,p.id);}},
      {l:&quot;4 hermano&quot;, f:function(n){return precioPosicion(n,4,p.id);}},
      {l:&quot;1/2 beca&quot;, f:function(n){return precioMediaBeca(n,p.id);}}
    ];
    filas.forEach(function(fi,idx){
      h+='<tr'+(idx%2?' class=&quot;alt&quot;':'')+'><td class=&quot;l&quot;>'+fi.l+'</td>';
      niveles.forEach(function(n){ h+='<td>'+money(fi.f(n))+'</td>'; });
      h+='</tr>';
    });
    h+='</tbody></table></div>';
  });
  $(&quot;tablas&quot;).innerHTML=h;
})();

function tablaSimple(id,data){
  var k=Object.keys(data),h='<table><thead><tr>';
  k.forEach(function(x){h+='<th>'+x+'</th>';}); h+='</tr></thead><tbody><tr>';
  k.forEach(function(x){h+='<td>'+money(data[x])+'</td>';}); h+='</tr></tbody></table>';
  $(id).innerHTML=h;
}
tablaSimple(&quot;tjor&quot;,ARANCELES.jornadaExtendida);
tablaSimple(&quot;ttprim&quot;,ARANCELES.talleresPrimaria);
tablaSimple(&quot;ttsec&quot;,ARANCELES.talleresSecundaria);

var selCant=$(&quot;cant&quot;), selPer=$(&quot;periodo&quot;), cont=$(&quot;hijos&quot;);
ARANCELES_PERIODOS.forEach(function(p){ var o=document.createElement(&quot;option&quot;);o.value=p.id;o.textContent=p.etiqueta;selPer.appendChild(o); });

function talleresDeNivel(n){ if(n.indexOf(&quot;Sala&quot;)===0)return{}; if(n.indexOf(&quot;Primaria&quot;)===0)return ARANCELES.talleresPrimaria; if(n.indexOf(&quot;Secundaria&quot;)===0)return ARANCELES.talleresSecundaria; return{}; }
function jornadaCompatible(n){ if(n.indexOf(&quot;Sala&quot;)===0)return n; if(n.indexOf(&quot;Primaria&quot;)===0)return &quot;Primaria&quot;; return null; }

function pintarTJ(i,nivel){
  var ct=cont.querySelector('.tall[data-i=&quot;'+i+'&quot;]'), fld=ct.parentNode, t=talleresDeNivel(nivel), k=Object.keys(t);
  if(k.length===0){ fld.style.display=&quot;none&quot;; ct.innerHTML=&quot;&quot;; }
  else { fld.style.display=&quot;&quot;; ct.innerHTML=k.map(function(n){return '<label><input type=&quot;checkbox&quot; class=&quot;chktall&quot; data-i=&quot;'+i+'&quot; value=&quot;'+n+'&quot;> '+n+' ('+money(t[n])+')</label>';}).join(&quot;&quot;); }
  var fj=cont.querySelector('.jorfld[data-i=&quot;'+i+'&quot;]'), cj=fj.querySelector(&quot;.jor&quot;);
  if(jornadaCompatible(nivel)){ fj.style.display=&quot;&quot;; } else { fj.style.display=&quot;none&quot;; cj.checked=false; }
}

function renderHijos(){
  var cant=parseInt(selCant.value,10); cont.innerHTML=&quot;&quot;;
  for(var i=1;i<=cant;i++){
    var descPos=descHermano(i,cant);
    var ex=descPos===0?'':' <span style=&quot;font-weight:400;color:#8a8194;font-size:.82rem;&quot;>(descuento '+Math.round(descPos*100)+'% sobre su nivel)</span>';
    var w=document.createElement(&quot;div&quot;); w.className=&quot;hijo&quot;;
    w.innerHTML='<div class=&quot;th&quot;>Hijo '+ORD[i]+ex+'</div>'+
      '<div class=&quot;row&quot;>'+
        '<div class=&quot;fld&quot;><label class=&quot;f&quot;>Nivel / curso</label><select class=&quot;nivel&quot; data-i=&quot;'+i+'&quot;>'+niveles.map(function(n){return '<option value=&quot;'+n+'&quot;>'+n+'</option>';}).join(&quot;&quot;)+'</select></div>'+
        '<div class=&quot;fld&quot;><label class=&quot;f&quot;>Beneficio</label><select class=&quot;beca&quot; data-i=&quot;'+i+'&quot;><option value=&quot;no&quot;>Sin beneficio</option><option value=&quot;si&quot;>1/2 beca</option></select></div>'+
        '<div class=&quot;fld jorfld&quot; data-i=&quot;'+i+'&quot; style=&quot;display:flex;align-items:flex-end;&quot;><label class=&quot;chkjor&quot;><input type=&quot;checkbox&quot; class=&quot;jor&quot; data-i=&quot;'+i+'&quot;> Jornada Extendida</label></div>'+
      '</div>'+
      '<div><label class=&quot;f&quot;>Talleres (opcional)</label><div class=&quot;tall&quot; data-i=&quot;'+i+'&quot;></div></div>';
    cont.appendChild(w);
    pintarTJ(i,niveles[0]);
  }
  var ns=cont.querySelectorAll(&quot;.nivel&quot;);
  for(var k=0;k<ns.length;k++){ ns[k].addEventListener(&quot;change&quot;,function(e){ pintarTJ(e.target.getAttribute(&quot;data-i&quot;),e.target.value); calcular(); }); }
  calcular();
}
cont.addEventListener(&quot;change&quot;,function(e){ if(!e.target.classList.contains(&quot;nivel&quot;)) calcular(); });

function fila(l,v){ return '<div><span>'+l+'</span><span>'+v+'</span></div>'; }

function calcular(){
  var cant=parseInt(selCant.value,10);
  var perId = selPer.value;
  var per = ARANCELES_PERIODOS.filter(function(p){return p.id===perId;})[0];
  var total=0,det=[];
  for(var i=1;i<=cant;i++){
    var nivel=cont.querySelector('.nivel[data-i=&quot;'+i+'&quot;]').value;
    var beca=cont.querySelector('.beca[data-i=&quot;'+i+'&quot;]').value===&quot;si&quot;;
    var jor=cont.querySelector('.jor[data-i=&quot;'+i+'&quot;]').checked;
    var cuota,etq;
    if(beca){ cuota=precioMediaBeca(nivel,perId); etq=&quot;Hijo &quot;+ORD[i]+&quot; (&quot;+nivel+&quot;) - 1/2 beca&quot;; }
    else {
      var desc=descHermano(i,cant);
      cuota=precioPosicion(nivel,i,perId,cant);
      etq=&quot;Hijo &quot;+ORD[i]+&quot; (&quot;+nivel+&quot;)&quot;+(desc>0?&quot; - &quot;+Math.round(desc*100)+&quot;% off&quot;:&quot;&quot;);
    }
    total+=cuota; det.push(fila(etq,money(cuota)));
    if(jor){ var jk=jornadaCompatible(nivel); if(jk&amp;&amp;ARANCELES.jornadaExtendida[jk]!==undefined){ var vj=ARANCELES.jornadaExtendida[jk]; total+=vj; det.push(fila(&quot;Jornada Extendida&quot;,money(vj))); } }
    var ch=cont.querySelectorAll('.chktall[data-i=&quot;'+i+'&quot;]:checked');
    for(var c=0;c<ch.length;c++){ var t=talleresDeNivel(nivel),v=t[ch[c].value]; total+=v; det.push(fila(&quot;Taller: &quot;+ch[c].value,money(v))); }
  }
  $(&quot;monto&quot;).textContent=money(total);
  $(&quot;det&quot;).innerHTML=det.join(&quot;&quot;);
  $(&quot;venc&quot;).textContent=per.etiqueta;
}
selCant.addEventListener(&quot;change&quot;,renderHijos);
selPer.addEventListener(&quot;change&quot;,calcular);
renderHijos();
</script>
<script>
(function(){
  function reportar(){ var h = document.body.scrollHeight; parent.postMessage({cstAranceles:true, alto:h}, &quot;*&quot;); }
  window.addEventListener(&quot;load&quot;, reportar);
  var obs = new MutationObserver(reportar);
  obs.observe(document.body, {childList:true, subtree:true, attributes:true});
  document.addEventListener(&quot;change&quot;, function(){ setTimeout(reportar, 30); });
  setInterval(reportar, 800);
})();
</script>
